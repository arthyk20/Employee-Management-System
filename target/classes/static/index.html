<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Employee Management System</h1>

<div class="form-container">

    <input type="text"
           id="name"
           placeholder="Name">

    <input type="email"
           id="email"
           placeholder="Email">

    <input type="text"
           id="department"
           placeholder="Department">

    <input type="number"
           id="salary"
           placeholder="Salary">

    <input type="text"
           id="gender"
           placeholder="Gender">

    <input type="date"
           id="dob">

    <input type="text"
           id="mobileNumber"
           placeholder="Mobile Number">

    <button onclick="saveEmployee()">
        Save Employee
    </button>

</div>

<hr>

<h2>Employee List</h2>

<table id="employeeTable">

    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Gender</th>
        <th>Age</th>
        <th>Mobile</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody></tbody>

</table>

<script src="script.js"></script>

</body>
</html>
