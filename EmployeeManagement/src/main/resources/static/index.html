<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Employee Management System</h1>

<!-- Fixed: Changed <div> to <form> and gave it an ID -->
<form id="employeeForm" class="form-container">

    <input type="hidden" id="employeeId">

    <input type="text" id="name" placeholder="Name" required>

    <input type="email" id="email" placeholder="Email" required>

    <input type="text" id="department" placeholder="Department" required>

    <input type="number" id="salary" placeholder="Salary" required>

    <input type="text" id="gender" placeholder="Gender" required>

    <input type="date" id="dob" required> <!-- Added required here too -->

    <input type="text" id="mobileNumber" placeholder="Mobile Number" required>

    <!-- Fixed: Changed to type="submit" and removed onclick -->
    <button type="submit">
        Save Employee
    </button>

</form>

<hr>

<h2>Employee List</h2>

<table id="employeeTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Gender</th>
        <th>Age</th>
        <th>Mobile</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
